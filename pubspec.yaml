name: scenarioshelf
version: 1.0.0+1
publish_to: none
description: TRPG通過シナリオ記録サービス

environment: 
  sdk: '>=3.4.3 <4.0.0'
  flutter: '3.29.2'

dependencies: 
  flutter: 
    sdk: flutter
  
  # Design
  cupertino_icons: 1.0.8
  flutter_svg: 2.0.17
  google_fonts: 6.2.1
  image: 4.5.3
  image_cropper: 9.0.0
  image_picker: 1.1.2
  shimmer: 3.0.0

  # BaaS
  uuid: 4.5.1
  supabase_flutter: 2.8.4
  firebase_core: 3.12.1
  firebase_analytics: 11.4.4
  firebase_crashlytics: 4.3.4
  google_sign_in: 6.3.0

  # State Management
  flutter_hooks: 0.21.2
  hooks_riverpod: 2.6.1
  riverpod_annotation: 2.6.1
  freezed_annotation: 3.0.0
  json_annotation: 4.9.0

  # Other
  go_router: 15.1.3
  intl: 0.20.2
  logger: 2.5.0
  app_tracking_transparency: 2.0.6
  collection: 1.19.1
  flutter_dotenv: 5.2.1

dev_dependencies:
  flutter_test: 
    sdk: flutter
  
  # Generator
  build_runner: 2.4.15
  freezed: 3.0.4
  json_serializable: 6.9.4
  riverpod_generator: 2.6.5
  go_router_builder: 2.8.2
  flutter_launcher_icons: 0.14.3
  flutter_oss_licenses: 3.0.4
  flutter_gen_runner: 5.10.0
  
  # Linter
  flutter_lints: 5.0.0
  custom_lint: 0.7.5
  very_good_analysis: 7.0.0
  riverpod_lint: 2.6.5
  
  # Other
  import_sorter: 4.6.0

  # build_runner の実行コマンド
  # flutter packages pub run build_runner build --delete-conflicting-outputs
  # flutter packages pub run build_runner watch --delete-conflicting-outputs

  # oss_licenses.dart の生成コマンド（パッケージを追加したら実行する）
  # flutter pub run flutter_oss_licenses:generate.dart -o lib/constants/oss_licenses.dart

flutter: 
  uses-material-design: true
  assets:
    - .env
    - .env.stg
    - .env.prod
    - assets/images/
    - assets/images/logos/
    - assets/images/empty_states/
    - assets/svgs/

import_sorter:
  comments: false
  ignored_files:
    - \/lib\/*\/*.freezed.dart
    - \/lib\/*\/*.g.dart
    - \/lib\/*\/oss_licenses.dart
    - \/lib\/*\/firebase_options.dart
    - \/lib\/*\/gen/*

  # 実行コマンド
  # flutter pub run import_sorter:main

flutter_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FFC966"
  ios: true
  remove_alpha_ios: true

  # 実行コマンド
  # flutter pub run flutter_launcher_icons:main

flutter_gen:
  output: lib/constants/assets/gen/
  line_length: 200

  integrations:
    flutter_svg: true
    rive: false
    lottie: false
  
  assets:
    exclude:
      - .env
      - .env.stg
      - .env.prod 
